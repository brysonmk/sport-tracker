name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    # A throwaway Postgres so CI can prove the migrations and the seed still work.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sports
          POSTGRES_PASSWORD: sports
          POSTGRES_DB: sports_tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sports -d sports_tracker"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://sports:sports@localhost:5432/sports_tracker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # also runs `prisma generate` (postinstall)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations and seed
        run: npx prisma migrate deploy && npm run db:seed
      - run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sports
          POSTGRES_PASSWORD: sports
          POSTGRES_DB: sports_tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sports -d sports_tracker"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://sports:sports@localhost:5432/sports_tracker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      # The tests run against a production build (see playwright.config.ts).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload the Playwright report (traces, screenshots) when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
