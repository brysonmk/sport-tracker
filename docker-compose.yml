# Local Postgres for development. Start it with: docker compose up -d
# Host port 5433 (not 5432) so it never clashes with another Postgres on your machine.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
      POSTGRES_DB: sports_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports_tracker"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
